name: Validate Repository Structure

# Runs on every push/PR to main so you always know the /docs folder and
# required Part 1 planning artefacts are present and committed.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /Docs folder exists
        run: |
          if [ ! -d "Docs" ]; then
            echo "::error::/Docs folder is missing"
            exit 1
          fi
          echo "/Docs folder found"

      - name: Check required Part 1 files exist
        run: |
          required_files=("Docs/ERD Diagram Final.png" "Docs/API Endpoint Plan 6.md" "Docs/RaceDay.sql")
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Required file $f is missing"
              missing=1
            else
              echo "Found $f"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "::error::README.md is missing from the repository root"
            exit 1
          fi
          echo "README.md found"

      - name: Basic SQL script sanity check
        run: |
          if ! grep -qi "CREATE TABLE" "Docs/RaceDay.sql"; then
            echo "::error::RaceDay.sql does not appear to contain any CREATE TABLE statements"
            exit 1
          fi
          echo "RaceDay.sql contains CREATE TABLE statements"

      - name: Structure validation passed
        run: echo "All required Part 1 files and folders are present."
